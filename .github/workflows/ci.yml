name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  docker-check:
    name: Docker Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checks
        run: docker compose -f compose.yaml -f compose.ci.yaml up --build --abort-on-container-exit --exit-code-from check check
